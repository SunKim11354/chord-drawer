<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guitar Chord Drawer V8</title><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f5f7fb;color:#172334;margin:0;padding:4px}.app{max-width:500px;margin:auto;background:white;padding:6px 12px;border-radius:18px;box-shadow:0 8px 32px #17233415}h1{margin:0 0 3px;font-size:1.35rem}.sub{color:#526172;margin:0 0 5px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.controls>div{min-width:0}label{display:block;font-weight:650;margin-bottom:2px;min-height:18px}select{width:100%;padding:5px;font-size:.85rem;border:1px solid #aebccc;border-radius:10px;background:white}select option{font-size:9px;padding:2px 3px}.picker{position:relative}.pick-button{width:100%;background:white;color:#172334;border:1px solid #aebccc;text-align:left;font-size:.9rem;padding:7px 9px;border-radius:9px}.pick-list{display:none;position:absolute;z-index:20;top:100%;left:0;width:100%;max-height:205px;overflow-y:auto;background:white;border:1px solid #aebccc;box-shadow:0 6px 18px #17233430;border-radius:8px}.picker.open .pick-list{display:block}#rootPicker .pick-list,#qualityPicker .pick-list{max-height:none;overflow-y:visible}#rootPicker .pick-entry,#qualityPicker .pick-entry{font-size:13.5px;padding:5.4px 7px;line-height:1.2}.pick-entry{display:block;width:100%;background:white;color:#172334;text-align:left;font-size:13.5px;padding:5.4px 7px;border:0;border-radius:0;line-height:1.2}.pick-entry:hover,.pick-entry:focus{background:#e6f0fc}.controls select{display:none}.name{text-align:center;font-size:1.9rem;font-weight:750;margin:3px 0 0}.diagram{display:flex;justify-content:center}svg{width:min(100%,235px);height:auto}.notes{text-align:center;color:#506071;line-height:1.35;font-size:.9rem;margin:2px 0}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:3px}button{border:0;border-radius:10px;padding:6px 12px;background:#1c64a4;color:white;font-size:1rem;cursor:pointer}button.secondary{background:#e8eef6;color:#183f64}.warning{color:#985420;text-align:center;min-height:0;margin:0}@media(max-width:420px){.app{padding:7px}.controls{gap:10px}select{font-size:1rem}}</style></head><body><main class="app"><h1>🎸 Guitar Chord Drawer</h1><p class="sub">Version 8 · 기본음과 코드 종류를 선택하세요.</p><div class="controls"><div><label for="root">1단 — 기본음 (A–G)</label><div class="picker" id="rootPicker"><button class="pick-button" type="button" aria-expanded="false"></button><div class="pick-list" role="listbox"></div></div><select id="root" aria-hidden="true" tabindex="-1"></select></div><div><label for="quality">2단 — 코드 종류</label><div class="picker" id="qualityPicker"><button class="pick-button" type="button" aria-expanded="false"></button><div class="pick-list" role="listbox"></div></div><select id="quality" aria-hidden="true" tabindex="-1"></select></div></div><div class="name" id="chordName"></div><div class="diagram"><svg id="diagram" viewBox="0 0 340 335" role="img" aria-label="기타 코드 운지 그림"></svg></div><p class="warning" id="warning"></p><p class="notes">● 숫자: 손가락 번호 (일부 코드는 프렛 번호) (1 검지 · 2 중지 · 3 약지 · 4 소지)<br>○ 개방현 · × 연주하지 않는 줄</p><div class="actions"><button id="save">운지도 PNG 저장</button><button class="secondary" id="print">인쇄</button></div></main><script>
const roots=['A','A# / Bb','B','C','C# / Db','D','D# / Eb','E','F','F# / Gb','G','G# / Ab'];const qualities=[['','Major'],['m','Minor (m)'],['7','7th (7)'],['m7','Minor 7th (m7)'],['maj7','Major 7th (maj7)'],['sus4','Sus4'],['dim','Diminished (dim)'],['aug','Augmented (aug)']];
const R=document.querySelector('#root'),Q=document.querySelector('#quality'),S=document.querySelector('#diagram');roots.forEach(x=>R.add(new Option(x,x.split(' / ')[0])));qualities.forEach(([v,l])=>Q.add(new Option(l,v)));R.value='A';Q.value='m';
// Each entry: frets from low E to high e. -1 means muted. All positions are standard playable chord voicings.
const shapes={
'A':{'':[ -1,0,2,2,2,0],'m':[-1,0,2,2,1,0],'7':[-1,0,2,0,2,0],'m7':[-1,0,2,0,1,0],'maj7':[-1,0,2,1,2,0],'sus4':[-1,0,2,2,3,0],'dim':[-1,0,1,2,1,-1],'aug':[-1,0,3,2,2,1]},
'A#':{'':[-1,1,3,3,3,1],'m':[-1,1,3,3,2,1],'7':[-1,1,3,1,3,1],'m7':[-1,1,3,1,2,1],'maj7':[-1,1,3,2,3,1],'sus4':[-1,1,3,3,4,1],'dim':[-1,1,2,3,2,-1],'aug':[-1,1,0,3,3,2]},
'B':{'':[-1,2,4,4,4,2],'m':[-1,2,4,4,3,2],'7':[-1,2,1,2,0,2],'m7':[-1,2,0,2,0,2],'maj7':[-1,2,4,3,4,2],'sus4':[-1,2,4,4,5,2],'dim':[-1,2,3,4,3,-1],'aug':[-1,2,1,0,0,-1]},
'C':{'':[-1,3,2,0,1,0],'m':[-1,3,5,5,4,3],'7':[-1,3,2,3,1,0],'m7':[-1,3,5,3,4,3],'maj7':[-1,3,2,0,0,0],'sus4':[-1,3,3,0,1,1],'dim':[-1,3,4,5,4,-1],'aug':[-1,3,2,1,1,0]},
'C#':{'':[-1,4,6,6,6,4],'m':[-1,4,6,6,5,4],'7':[-1,4,6,4,6,4],'m7':[-1,4,6,4,5,4],'maj7':[-1,4,6,5,6,4],'sus4':[-1,4,6,6,7,4],'dim':[-1,4,5,6,5,-1],'aug':[-1,4,3,2,2,-1]},
'D':{'':[-1,-1,0,2,3,2],'m':[-1,-1,0,2,3,1],'7':[-1,-1,0,2,1,2],'m7':[-1,-1,0,2,1,1],'maj7':[-1,-1,0,2,2,2],'sus4':[-1,-1,0,2,3,3],'dim':[-1,-1,0,1,3,1],'aug':[-1,-1,0,3,3,2]},
'D#':{'':[-1,-1,1,3,4,3],'m':[-1,-1,1,3,4,2],'7':[-1,-1,1,3,2,3],'m7':[-1,-1,1,3,2,2],'maj7':[-1,-1,1,3,3,3],'sus4':[-1,-1,1,3,4,4],'dim':[-1,-1,1,2,4,2],'aug':[-1,-1,1,0,0,3]},
'E':{'':[0,2,2,1,0,0],'m':[0,2,2,0,0,0],'7':[0,2,0,1,0,0],'m7':[0,2,0,0,0,0],'maj7':[0,2,1,1,0,0],'sus4':[0,2,2,2,0,0],'dim':[-1,-1,2,3,5,3],'aug':[0,3,2,1,1,0]},
'F':{'':[1,3,3,2,1,1],'m':[1,3,3,1,1,1],'7':[1,3,1,2,1,1],'m7':[1,3,1,1,1,1],'maj7':[-1,-1,3,2,1,0],'sus4':[1,3,3,3,1,1],'dim':[-1,-1,3,4,6,4],'aug':[-1,-1,3,2,2,1]},
'F#':{'':[2,4,4,3,2,2],'m':[2,4,4,2,2,2],'7':[2,4,2,3,2,2],'m7':[2,4,2,2,2,2],'maj7':[2,4,3,3,2,2],'sus4':[2,4,4,4,2,2],'dim':[-1,-1,4,5,7,5],'aug':[-1,-1,4,3,3,2]},
'G':{'':[3,2,0,0,0,3],'m':[3,5,5,3,3,3],'7':[3,2,0,0,0,1],'m7':[3,5,3,3,3,3],'maj7':[3,2,0,0,0,2],'sus4':[3,3,0,0,1,3],'dim':[-1,-1,5,6,8,6],'aug':[3,2,1,0,0,3]},
'G#':{'':[4,6,6,5,4,4],'m':[4,6,6,4,4,4],'7':[4,6,4,5,4,4],'m7':[4,6,4,4,4,4],'maj7':[4,6,5,5,4,4],'sus4':[4,6,6,6,4,4],'dim':[-1,-1,6,7,9,7],'aug':[4,3,2,1,1,4]}};
function setupPicker(select,pickerId){const picker=document.getElementById(pickerId),button=picker.querySelector('.pick-button'),list=picker.querySelector('.pick-list');function update(){button.textContent=select.selectedOptions[0].textContent+' ▾'}for(const opt of select.options){const entry=document.createElement('button');entry.type='button';entry.className='pick-entry';entry.setAttribute('role','option');entry.textContent=opt.textContent;entry.onclick=()=>{select.value=opt.value;picker.classList.remove('open');button.setAttribute('aria-expanded','false');update();draw();button.focus()};list.append(entry)}button.onclick=()=>{document.querySelectorAll('.picker').forEach(p=>{if(p!==picker){p.classList.remove('open');p.querySelector('.pick-button').setAttribute('aria-expanded','false')}});const open=picker.classList.toggle('open');button.setAttribute('aria-expanded',String(open))};update()}setupPicker(R,'rootPicker');setupPicker(Q,'qualityPicker');document.addEventListener('click',e=>{if(!e.target.closest('.picker'))document.querySelectorAll('.picker').forEach(p=>{p.classList.remove('open');p.querySelector('.pick-button').setAttribute('aria-expanded','false')})});
// Verified finger assignments for common open chords; a barre shares a finger number.
const openFingers={A:{'':[0,0,2,3,4,0],m:[0,0,2,3,1,0],7:[0,0,2,0,3,0],m7:[0,0,2,0,1,0],maj7:[0,0,2,1,3,0],sus4:[0,0,1,2,3,0]},C:{'':[0,3,2,0,1,0],7:[0,3,2,4,1,0],maj7:[0,3,2,0,0,0]},D:{'':[0,0,0,1,3,2],m:[0,0,0,2,3,1],7:[0,0,0,2,1,3],m7:[0,0,0,2,1,1],maj7:[0,0,0,1,1,1],sus4:[0,0,0,1,3,4]},E:{'':[0,2,3,1,0,0],m:[0,2,3,0,0,0],7:[0,2,0,1,0,0],m7:[0,2,0,0,0,0],maj7:[0,3,1,2,0,0],sus4:[0,2,3,4,0,0]},G:{'':[2,1,0,0,0,3],7:[3,2,0,0,0,1],maj7:[3,2,0,0,0,1]}};
function getFingers(root,quality,fs){const known=openFingers[root]?.[quality];if(known)return known;const fretted=fs.map((f,i)=>({f,i})).filter(o=>o.f>0);if(!fretted.length)return Array(6).fill(0);const min=Math.min(...fretted.map(o=>o.f));const atMin=fretted.filter(o=>o.f===min);const result=Array(6).fill(0);if(atMin.length>=2){atMin.forEach(o=>result[o.i]=1);let finger=2;for(const o of fretted.filter(o=>o.f>min).sort((a,b)=>a.f-b.f||a.i-b.i)){if(finger>4)return null;result[o.i]=finger++}return result}if(fretted.length>4)return null;fretted.sort((a,b)=>a.f-b.f||a.i-b.i).forEach((o,i)=>result[o.i]=i+1);return result}
const ns='http://www.w3.org/2000/svg';function el(tag,attrs={},content){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(content!==undefined)n.textContent=content;S.append(n);return n}function draw(){S.replaceChildren();const chord=R.value+Q.value;document.querySelector('#chordName').textContent=chord;const fs=shapes[R.value][Q.value];const fingers=getFingers(R.value,Q.value,fs);let positives=fs.filter(v=>v>0),min=Math.min(...positives),max=Math.max(...positives);const base=max<=5?1:min;document.querySelector('#warning').textContent=!fingers?'이 코드는 원 안에 프렛 번호를 표시합니다 (손가락 번호 아님).':max-base>=5?'넓은 운지 간격입니다. 다른 운지법을 고려하세요.':'';const x0=60,dx=44,y0=91,dy=43;for(let i=0;i<6;i++){el('line',{x1:x0+i*dx,y1:y0,x2:x0+i*dx,y2:y0+dy*5,stroke:'#35465a','stroke-width':i===0||i===5?2:1.5});el('line',{x1:x0,y1:y0+i*dy,x2:x0+5*dx,y2:y0+i*dy,stroke:'#35465a','stroke-width':i===0&&base===1?6:1.5})}if(base>1)el('text',{x:27,y:y0+dy/2+5,'font-size':15,fill:'#263d55'},base+'fr');fs.forEach((f,i)=>{const x=x0+i*dx;if(f===-1||f===0){el('text',{x,y:76,'font-size':23,'text-anchor':'middle',fill:'#263d55'},f===-1?'×':'○')}else{const y=y0+(f-base+.5)*dy;el('circle',{cx:x,cy:y,r:16,fill:'#1c64a4'});el('text',{x,y:y+5,'font-size':14,'text-anchor':'middle',fill:'white','font-weight':'bold'},String(fingers?fingers[i]:f))}});['E','A','D','G','B','e'].forEach((s,i)=>el('text',{x:x0+i*dx,y:23,'font-size':16,'text-anchor':'middle',fill:'#526172'},s));['6','5','4','3','2','1'].forEach((n,i)=>el('text',{x:x0+i*dx,y:45,'font-size':15,'text-anchor':'middle',fill:'#526172'},n));}R.onchange=Q.onchange=draw;draw();document.querySelector('#print').onclick=()=>window.print();document.querySelector('#save').onclick=()=>{const cloned=S.cloneNode(true);cloned.setAttribute('xmlns',ns);cloned.setAttribute('width','680');cloned.setAttribute('height','670');const xml=new XMLSerializer().serializeToString(cloned);const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=680;c.height=670;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Guitar_Chord_'+R.value+Q.value+'.png';a.click()};img.src=url};</script></body></html>
